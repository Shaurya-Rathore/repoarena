services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: repoarena
      POSTGRES_PASSWORD: repoarena
      POSTGRES_DB: repoarena
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repoarena"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: repoarena
      MINIO_ROOT_PASSWORD: repoarena-local-only
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
