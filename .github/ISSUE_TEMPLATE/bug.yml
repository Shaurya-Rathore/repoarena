name: Bug report
description: Report a reproducible RepoArena problem.
body:
  - type: input
    id: version
    attributes: { label: RepoArena version, placeholder: "repoarena --version" }
    validations: { required: true }
  - type: input
    id: environment
    attributes: { label: OS and Node version }
    validations: { required: true }
  - type: input
    id: agent
    attributes:
      label: Agent and version
      description: Use “not applicable” when relevant.
  - type: textarea
    id: command
    attributes: { label: Command and expected behavior }
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Sanitized output
      description: "Never paste credentials, private source, hidden evaluators, or reference fixes."
