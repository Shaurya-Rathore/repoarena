name: Feature request
description: Suggest a focused improvement.
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: What workflow is difficult today? }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposed behavior }
  - type: dropdown
    id: surface
    attributes: { label: Area, options: [CLI, Agent adapter, Task mining, Local UI, Reporter, GitHub Action, Documentation, Other] }
