name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: repoarena
          POSTGRES_PASSWORD: repoarena
          POSTGRES_DB: repoarena_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U repoarena"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://repoarena:repoarena@127.0.0.1:5432/repoarena_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:secret-scan
      - run: pnpm verify
      - run: pnpm test:integration
      - run: pnpm --filter @repoarena/cloud-product test:e2e
      - run: pnpm --filter @repoarena/github-action test:e2e
