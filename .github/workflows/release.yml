name: Release candidate
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  dry-run:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: repoarena
          POSTGRES_PASSWORD: repoarena
          POSTGRES_DB: repoarena_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U repoarena"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://repoarena:repoarena@127.0.0.1:5432/repoarena_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install PostgreSQL 18 client
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y curl ca-certificates postgresql-common

          sudo install -d /usr/share/postgresql-common/pgdg

          sudo curl             --fail             --silent             --show-error             --location             -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc             https://www.postgresql.org/media/keys/ACCC4CF8.asc

          . /etc/os-release

          cat <<EOF | sudo tee /etc/apt/sources.list.d/pgdg.sources
          Types: deb
          URIs: https://apt.postgresql.org/pub/repos/apt
          Suites: ${VERSION_CODENAME}-pgdg
          Components: main
          Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          EOF

          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

          /usr/lib/postgresql/18/bin/pg_dump --version
          /usr/lib/postgresql/18/bin/pg_restore --version
          /usr/lib/postgresql/18/bin/createdb --version
          /usr/lib/postgresql/18/bin/dropdb --version

      - name: Verify PostgreSQL client
        run: |
          which pg_dump
          which pg_restore
          which createdb
          which dropdb
          pg_dump --version
          pg_restore --version

      - run: pnpm release:verify
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: repoarena-${{ github.ref_name }}
          path: release-artifacts/
          if-no-files-found: error
