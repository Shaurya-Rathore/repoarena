name: Release candidate
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  dry-run:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: repoarena
          POSTGRES_PASSWORD: repoarena
          POSTGRES_DB: repoarena_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U repoarena"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://repoarena:repoarena@127.0.0.1:5432/repoarena_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: corepack enable && corepack prepare pnpm@9.15.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:verify
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: repoarena-${{ github.ref_name }}
          path: release-artifacts/
          if-no-files-found: error
